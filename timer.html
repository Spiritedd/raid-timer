<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raid & Dungeon Timers</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; display: flex; gap: 30px; }
  h2 { margin-bottom: 10px; }
  .section { flex: 1; }
  .raid, .dungeon { margin: 10px 0; padding: 10px; border: 1px solid #444; border-radius: 8px; width: 300px; }
  button { margin: 5px; padding: 5px 10px; }
  .time { font-size: 1.3em; margin-top: 5px; cursor: pointer; }
  .endTime { font-size: 0.9em; color: #aaa; margin-top: 3px; }
  .ready { color: #00ff00; }
  .red { color: #ff4d4d; }
  .yellow { color: #ffe44d; }
  .sidePanel { width: 260px; border-left: 2px solid #555; padding-left: 20px; }
  .stampBox { background:#222; padding:10px; border:1px solid #555; border-radius:6px; white-space:pre-wrap; }
</style>
</head>
<body>

<div class="section">
  <h2>Raids</h2>
  <div id="raids"></div>

  <h2>Dungeons</h2>
  <div id="dungeons"></div>
</div>

<div class="sidePanel">
  <h2>Discord Timestamps</h2>
  <div id="stampList" class="stampBox"></div>
</div>

<script>
const raidList = [
  { name: "3H - Red Ribbon", cooldown: 180, fail: 15 },
  { name: "4H - Android", cooldown: 240, fail: 75 },
  { name: "4H - Snowfield", cooldown: 240, fail: 75 },
  { name: "3H - Babidi", cooldown: 180, fail: 15 },
  { name: "4H - Majin Buu", cooldown: 240, fail: 75 },
  { name: "4H - Gotenks", cooldown: 240, fail: 75 },
  { name: "4H - Super Saiba", cooldown: 240, fail: 75 },
  { name: "4H - The Drink", cooldown: 240, fail: 75 },
  { name: "3H - Animal Dojo", cooldown: 180, fail: 15 }
];

const raidsDiv = document.getElementById("raids");
const dungeonsDiv = document.getElementById("dungeons");
const stampList = document.getElementById("stampList");

const timers = {};
const remainingTimes = {};

raidList.forEach((raid, index) => {
  const isDungeon = raid.cooldown === 180;
  const container = document.createElement("div");
  container.className = isDungeon ? "dungeon" : "raid";

  const nameEl = document.createElement("div");
  nameEl.textContent = raid.name;
  container.appendChild(nameEl);

  const counterEl = document.createElement("div");
  counterEl.textContent = "Counter: 0";
  counterEl.style.cursor = "pointer";
  counterEl.onclick = () => {
    let val = prompt("Counter value:", counterEl.textContent.split(': ')[1]);
    if (val !== null && !isNaN(val)) counterEl.textContent = "Counter: " + val;
    updateStamps();
  }
  container.appendChild(counterEl);

  const timeEl = document.createElement("div");
  timeEl.className = "time";
  timeEl.textContent = formatTime(raid.cooldown * 60);
  container.appendChild(timeEl);

  const endEl = document.createElement("div");
  endEl.className = "endTime";
  endEl.textContent = "Ends at: --:--";
  container.appendChild(endEl);

  remainingTimes[index] = raid.cooldown * 60;

  timeEl.onclick = () => customizeTime(index, timeEl, endEl, container);

  const startBtn = document.createElement("button");
  startBtn.textContent = "Start";
  startBtn.onclick = () => handleStartPause(index, timeEl, endEl, startBtn);
  container.appendChild(startBtn);

  const resetBtn = document.createElement("button");
  resetBtn.textContent = "Reset";
  resetBtn.onclick = () => handleReset(index, timeEl, endEl, startBtn);
  container.appendChild(resetBtn);

  const successBtn = document.createElement("button");
  successBtn.textContent = "Success";
  successBtn.onclick = () => handleSuccess(index, raid.cooldown * 60, timeEl, endEl, startBtn);
  container.appendChild(successBtn);

  const failBtn = document.createElement("button");
  failBtn.textContent = "Fail";
  failBtn.onclick = () => handleFail(index, raid.fail * 60, timeEl, endEl, startBtn);
  container.appendChild(failBtn);

  if (isDungeon) dungeonsDiv.appendChild(container);
  else raidsDiv.appendChild(container);
});

function formatTime(sec) {
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return `${h}h ${m}m ${s}s`;
}

function formatEnd(date) {
  return date.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
}

function recolor(el, sec) {
  if (sec <= 0) { el.className = "time ready"; return; }
  if (sec > 3600) el.className = "time red";
  else el.className = "time yellow";
}

function startTimer(index, displayEl, endEl, callback) {
  clearInterval(timers[index]);
  let remain = remainingTimes[index];
  const end = new Date(Date.now() + remain*1000);
  endEl.textContent = "Ends at: " + formatEnd(end);

  timers[index] = setInterval(() => {
    remain--; remainingTimes[index] = remain;
    displayEl.textContent = formatTime(remain);
    recolor(displayEl, remain);
    if (remain <= 0) {
      clearInterval(timers[index]);
      displayEl.textContent = "Ready!";
      displayEl.className = "time ready";
      endEl.textContent = "Ends at: --:--";
      callback();
    }
    updateStamps();
  }, 1000);
}

function handleStartPause(i, t, e, b){
  if (b.textContent === "Start"){
    startTimer(i, t, e, () => b.textContent="Success");
    b.textContent = "Pause";
  } else {
    clearInterval(timers[i]);
    b.textContent = "Start";
  }
}

function handleReset(i,t,e,b){
  clearInterval(timers[i]);
  t.textContent = formatTime(remainingTimes[i]);
  recolor(t, remainingTimes[i]);
  e.textContent = "Ends at: --:--";
  b.textContent = "Start";
  updateStamps();
}

function handleSuccess(i, cd, t, e, b){
  clearInterval(timers[i]);
  remainingTimes[i] = cd;
  startTimer(i,t,e,()=>{});
  b.textContent="Pause";
}

function handleFail(i, sec, t, e, b){
  clearInterval(timers[i]);
  remainingTimes[i] = sec;
  startTimer(i,t,e,()=>{});
  b.textContent="Pause";
}

function customizeTime(i, t, e, box){
  let h = prompt("Hours:", Math.floor(remainingTimes[i]/3600));
  if (h===null) return;
  let m = prompt("Minutes:", Math.floor((remainingTimes[i]%3600)/60));
  if (m===null) return;
  remainingTimes[i] = parseInt(h)*3600 + parseInt(m)*60;
  t.textContent = formatTime(remainingTimes[i]);
  recolor(t, remainingTimes[i]);
  const btn = box.querySelector("button");
  startTimer(i, t, e, () => btn.textContent="Success");
  btn.textContent = "Pause";
  updateStamps();
}

function updateStamps(){
  let text = '';
  Object.keys(remainingTimes).forEach(i=>{
    const raid = raidList[i];
    if (!raid) return;
    const ts = Math.floor(Date.now()/1000) + remainingTimes[i];
    text += `${raid.name}: <t:${ts}:R>\n`;
  });
  stampList.textContent = text;
}
</script>

</body>
</html>
