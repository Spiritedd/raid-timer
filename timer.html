<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Timer</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
  #timer { font-size: 48px; margin: 20px; cursor: pointer; }
  #realTime { font-size: 24px; margin: 20px; }
  footer { margin-top: 50px; font-weight: bold; }
</style>
</head>
<body>

<h1>Custom Timer</h1>
<div>
  <button onclick="setPreset(1)">1h</button>
  <button onclick="setPreset(2)">2h</button>
  <button onclick="setPreset(3)">3h</button>
</div>

<div id="timer">00:00</div>
<div id="realTime"></div>
<label><input type="checkbox" id="pushNotif"> Enable push notifications</label>

<footer>made by <a href="https://discord.gg/fsrinfo" target="_blank">https://discord.gg/fsrinfo</a> using ChatGPT</footer>

<audio id="dingSound" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<script>
let timerDisplay = document.getElementById('timer');
let realTimeDisplay = document.getElementById('realTime');
let ding = document.getElementById('dingSound');
let timerInterval, targetTime;
let pushEnabled = false;

// Load saved timer if exists
if(localStorage.getItem('timerEnd')){
  targetTime = parseInt(localStorage.getItem('timerEnd'));
  startTimer();
}

document.getElementById('pushNotif').addEventListener('change', (e) => {
  pushEnabled = e.target.checked;
  if(pushEnabled && Notification.permission !== "granted") {
    Notification.requestPermission();
  }
});

// Set preset in hours
function setPreset(hours){
  let mins = prompt("Minutes after hours?");
  if(mins === null) return;
  let totalMs = ((parseInt(hours)||0) * 60 + (parseInt(mins)||0)) * 60 * 1000;
  targetTime = Date.now() + totalMs;
  localStorage.setItem('timerEnd', targetTime);
  startTimer();
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    let remaining = targetTime - Date.now();
    if(remaining <= 0){
      clearInterval(timerInterval);
      timerDisplay.textContent = "00:00";
      ding.play();
      flashTab();
      if(pushEnabled && Notification.permission === "granted"){
        new Notification("Timer Finished!");
      }
      // Auto-reset after finishing
      targetTime = Date.now();
      localStorage.removeItem('timerEnd');
    } else {
      let totalSec = Math.floor(remaining / 1000);
      let min = String(Math.floor(totalSec / 60)).padStart(2,'0');
      let sec = String(totalSec % 60).padStart(2,'0');
      timerDisplay.textContent = `${min}:${sec}`;
    }
  }, 1000);
}

// Flash tab on finish
function flashTab(){
  let flash = true;
  let originalTitle = document.title;
  let flashInterval = setInterval(() => {
    document.title = flash ? "⏰ Timer Done!" : originalTitle;
    flash = !flash;
  }, 500);
  setTimeout(() => { clearInterval(flashInterval); document.title = originalTitle; }, 5000);
}

// Real-time clock without seconds
function updateRealTime(){
  let now = new Date();
  let hours = String(now.getHours()).padStart(2,'0');
  let minutes = String(now.getMinutes()).padStart(2,'0');
  realTimeDisplay.textContent = `${hours}:${minutes}`;
}
setInterval(updateRealTime, 1000);
updateRealTime();
</script>

</body>
</html>
