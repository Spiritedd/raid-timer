<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raid Cooldowns</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; text-align: center; padding: 20px; }
  h1 { margin-bottom: 20px; }
  .raid { margin: 10px 0; padding: 10px; border: 1px solid #444; border-radius: 8px; display: inline-block; width: 300px; }
  button { margin: 5px; padding: 5px 10px; }
  .time { font-size: 1.3em; margin-top: 5px; cursor: pointer; }
  .endTime { font-size: 0.9em; color: #aaa; margin-top: 3px; }
  footer { margin-top: 30px; font-size: 0.9em; color: #ccc; }
</style>
</head>
<body>

<h1>Raid Cooldowns</h1>
<div id="raids"></div>

<footer>Double Click "Pause" to Reset timer. Click the timer to customize main cooldown.</footer>

<script>
const raidList = [
  { name: "3H - Red Ribbon", cooldown: 180, fail: 15 },
  { name: "4H - Android", cooldown: 240, fail: 75 },
  { name: "4H - Snowfield", cooldown: 240, fail: 75 },
  { name: "3H - Babidi", cooldown: 180, fail: 15 },
  { name: "4H - Majin Buu", cooldown: 240, fail: 75 },
  { name: "4H - Gotenks", cooldown: 240, fail: 75 },
  { name: "4H - Super Saiba", cooldown: 240, fail: 75 },
  { name: "4H - The Drink", cooldown: 240, fail: 75 },
  { name: "3H - Animal Dojo", cooldown: 180, fail: 15 }
];

const raidsDiv = document.getElementById("raids");
const timers = {};
const remainingTimes = {}; // store remaining main cooldown in seconds

raidList.forEach((raid, index) => {
  const raidDiv = document.createElement("div");
  raidDiv.className = "raid";

  const nameEl = document.createElement("div");
  nameEl.textContent = raid.name;
  raidDiv.appendChild(nameEl);

  const timeEl = document.createElement("div");
  timeEl.className = "time";
  timeEl.textContent = formatTime(raid.cooldown * 60);
  raidDiv.appendChild(timeEl);

  const endEl = document.createElement("div");
  endEl.className = "endTime";
  endEl.textContent = "Ends at: --:--:--";
  raidDiv.appendChild(endEl);

  remainingTimes[index] = raid.cooldown * 60;

  // Click on timer to customize main cooldown
  timeEl.onclick = () => {
    const newMins = prompt("Enter new cooldown in minutes:", Math.ceil(remainingTimes[index] / 60));
    if (newMins !== null && !isNaN(newMins) && newMins > 0) {
      remainingTimes[index] = Math.floor(newMins * 60);
      clearInterval(timers[index]);
      timeEl.textContent = formatTime(remainingTimes[index]);
      endEl.textContent = "Ends at: --:--:--";
      const btn = raidDiv.querySelector("button");
      btn.textContent = "Start";
    }
  };

  // Start/Pause button
  const startBtn = document.createElement("button");
  startBtn.textContent = "Start";
  startBtn.style.width = "80px";
  startBtn.onclick = () => handleStartPause(index, timeEl, endEl, startBtn);
  startBtn.ondblclick = () => handleReset(index, timeEl, endEl, startBtn);
  raidDiv.appendChild(startBtn);

  // Fail button
  const failBtn = document.createElement("button");
  failBtn.textContent = "Fail";
  failBtn.style.width = "80px";
  failBtn.onclick = () => handleFail(index, raid.fail * 60, timeEl, endEl, startBtn);
  raidDiv.appendChild(failBtn);

  raidsDiv.appendChild(raidDiv);
});

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function formatEndTime(date) {
  return date.toLocaleTimeString();
}

function startTimer(index, displayEl, endEl, onFinish) {
  if (timers[index]) clearInterval(timers[index]);
  let remaining = remainingTimes[index];
  const endTime = new Date(Date.now() + remaining * 1000);
  endEl.textContent = "Ends at: " + formatEndTime(endTime);

  timers[index] = setInterval(() => {
    remaining--;
    remainingTimes[index] = remaining;
    displayEl.textContent = formatTime(remaining);
    if (remaining <= 0) {
      clearInterval(timers[index]);
      displayEl.textContent = "Ready!";
      endEl.textContent = "Ends at: --:--:--";
      onFinish();
    }
  }, 1000);
}

function handleStartPause(index, displayEl, endEl, btn) {
  if (btn.textContent === "Start") {
    startTimer(index, displayEl, endEl, () => btn.textContent = "Success");
    btn.textContent = "Pause";
  } else if (btn.textContent === "Pause") {
    clearInterval(timers[index]);
  }
}

function handleReset(index, displayEl, endEl, btn) {
  clearInterval(timers[index]);
  displayEl.textContent = formatTime(remainingTimes[index]);
  endEl.textContent = "Ends at: --:--:--";
  btn.textContent = "Start";
}

function handleFail(index, failSeconds, displayEl, endEl, btn) {
  clearInterval(timers[index]);
  remainingTimes[index] = failSeconds;
  startTimer(index, displayEl, endEl, () => btn.textContent = "Success");
  btn.textContent = "Pause";
}
</script>

</body>
</html>
